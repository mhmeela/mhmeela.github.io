.link{margin-right:1rem;font-weight:600}

.bar{height:7px;background:var(--line);border-radius:4px;margin-top:.2rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.in-view .bar i{width:var(--w)}

.rv.in-view{opacity:1;transform:none}
.certs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.cert{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;overflow:hidden;font:inherit;color:inherit;transition:border-color .2s}

.cert h3{margin:0 0 .2rem}
.cert .count{color:var(--link);font-weight:600;font-size:.95rem}

.lb-box{max-width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;gap:.6rem;align-items:center}
.lb-box h3{color:#fff;margin:0}

.lb-bar{display:flex;gap:.8rem;align-items:center;justify-content:center}
.lb-btn{background:var(--butter);color:var(--ink);border:0;border-radius:6px;padding:.5rem .9rem;font:600 1rem var(--body);cursor:pointer}

.lb-close{position:absolute;top:calc(.8rem + env(safe-area-inset-top,0px));right:1rem}

.card p.meta{text-align:left;hyphens:none}

.ch{display:inline-block;opacity:0;transform:translateY(.6em);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*35ms)}

.card{position:relative}
.card>*{position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--cx,50%) var(--cy,0%),rgba(255,233,122,.45),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}

header nav a{position:relative}

@media (prefers-reduced-motion:reduce){.ch{opacity:1;transform:none;animation:none}.card.pop,#lb.open,#lb.open .lb-img{animation:none}.wrap h2::after{transform:none;transition:none}#up{transition:none}#glow{display:none}}

footer{max-width:980px;margin:4rem auto 0;padding:1.5rem;color:var(--muted);font-size:.93rem;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.bar i{transition:none}.caret{animation:none}.more{transition:none}}

function counters() {

    const t0 = performance.now() + 300;
    (function f(t) {
      const k = Math.max(0, Math.min((t - t0) / 1800, 1)), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (n * e).toFixed(d);
      if (k < 1) requestAnimationFrame(f);
    })(performance.now());
  });
}

function certificates() {
  const list = DATA.certificates, lb = $("lb");
  let g = 0, k = 0, back = null;
  $("certbody").innerHTML = list.map((c, i) => {
    const n = c.images.length;
    return '<button class="cert" type="button" data-i="' + i + '" aria-haspopup="dialog">' +
      '<div class="cover"><span>' + esc(c.icon) + "</span>" +
      (n ? '<img src="' + esc(c.images[0].src) + '" alt="" loading="lazy" onerror="this.remove()">' : "") + "</div>" +
      '<div class="body"><h3>' + esc(c.title) + '</h3><p class="meta">' + esc(c.blurb) + "</p>" +
      '<span class="count">' + (n ? n + (n === 1 ? " certificate, click to view" : " certificates, click to view") : "Coming soon") + "</span></div></button>";
  }).join("");
  function show() {
    const c = list[g], im = c.images[k], img = $("lbimg");
    $("lbtitle").textContent = c.title;
    $("lbcap").textContent = im.caption || "";
    img.alt = im.caption || c.title;
    img.onerror = () => { $("lbcap").textContent = "Image not found: " + im.src + " (check the file name in your assets folder)"; };
    img.src = im.src;
    $("lbcount").textContent = (k + 1) + " / " + c.images.length;
    $("lbprev").disabled = k === 0;
    $("lbnext").disabled = k === c.images.length - 1;
  }
  function openLb(i) {
    if (!list[i].images.length) return;
    g = i; k = 0; back = document.activeElement;
    lb.classList.add("open"); document.body.style.overflow = "hidden";
    show(); $("lbclose").focus();
  }
  function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; if (back) back.focus(); }
  function step(d) {
    k = Math.max(0, Math.min(list[g].images.length - 1, k + d)); show();
    if (document.activeElement && document.activeElement.disabled) $("lbclose").focus();
  }
  $("certbody").addEventListener("click", (e) => { const b = e.target.closest(".cert"); if (b) openLb(+b.dataset.i); });
  $("lbclose").addEventListener("click", closeLb);
  $("lbprev").addEventListener("click", () => step(-1));
  $("lbnext").addEventListener("click", () => step(1));
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "Tab") {
      const f = [$("lbclose"), $("lbprev"), $("lbnext")].filter((x) => !x.disabled);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
}


function reveal() {
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in-view"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".rv").forEach((el) => io.observe(el));
  const bar = $("bar");
  addEventListener("scroll", () => { bar.style.width = (scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight) * 100) + "%"; }, { passive: true });
}

function placeholders() {
  if (!HIGHLIGHT_PLACEHOLDERS) return;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: (n) => n.parentNode.closest("script,style,header") ? 2 : 1 }), list = [];
  while (w.nextNode()) if (/\[[^\]]*\]/.test(w.currentNode.nodeValue)) list.push(w.currentNode);
  list.forEach((n) => {
    const f = document.createDocumentFragment();
    n.nodeValue.split(/(\[[^\]]*\])/).forEach((s) => {
      if (/^\[[^\]]*\]$/.test(s)) { const k = document.createElement("mark"); k.className = "ph"; k.textContent = s; f.appendChild(k); } else f.appendChild(document.createTextNode(s));
    });
    n.parentNode.replaceChild(f, n);
  });
}



/* ===== upgrade pack ===== */
function splitName() {
  const h = $("name"), t = h.textContent; let i = 0;
  h.setAttribute("aria-label", t); h.textContent = "";
  t.split(" ").forEach((word, wi, a) => {
    const s = document.createElement("span"); s.className = "w"; s.setAttribute("aria-hidden", "true");
    [...word].forEach((c) => { const l = document.createElement("span"); l.className = "ch"; l.style.setProperty("--i", i++); l.textContent = c; s.appendChild(l); });
    h.appendChild(s); if (wi < a.length - 1) h.appendChild(document.createTextNode(" "));
  });
}



function glow() {
  if (REDUCE || matchMedia("(hover: none)").matches) return;
  const g = $("glow"), about = $("about"); let raf = 0, px = 0, py = 0, on = false;
  addEventListener("pointermove", (e) => {
    px = e.clientX; py = e.clientY; on = py >= about.getBoundingClientRect().top;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; g.style.opacity = on ? 1 : 0; g.style.transform = "translate(" + px + "px," + py + "px)"; });
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { g.style.opacity = 0; });
}

const _setFilter = setFilter;
setFilter = function (t, s) {
  const r = _setFilter(t, s);
  document.querySelectorAll("#topics button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === t));
  if (!REDUCE) document.querySelectorAll("#projectbody .card:not([hidden])").forEach((c, i) => {
    c.classList.remove("pop"); void c.offsetWidth; c.style.animationDelay = i * 40 + "ms"; c.classList.add("pop");
  });
  return r;
};

function polish() {
  splitName();
  document.querySelectorAll(".stats div").forEach((d, i) => d.style.setProperty("--k", i));
  document.querySelectorAll(".stack .card.rv,.grid .card.rv").forEach((c, i) => c.style.setProperty("--n", i % 4));
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest && e.target.closest(".card"); if (!c) return;
    const r = c.getBoundingClientRect(); c.style.setProperty("--cx", e.clientX - r.left + "px"); c.style.setProperty("--cy", e.clientY - r.top + "px");
  }, { passive: true });
  const seen = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("seen"); seen.unobserve(e.target); } }), { threshold: .2 });
  document.querySelectorAll(".wrap").forEach((w) => seen.observe(w));
  const links = [...document.querySelectorAll("header nav a")];
  const spy = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  links.forEach((a) => { const s = document.querySelector(a.getAttribute("href")); if (s) spy.observe(s); });
  const up = $("up"), ring = $("ring");
  up.addEventListener("click", () => scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" }));
  addEventListener("scroll", () => {
    const p = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight);
    ring.style.strokeDashoffset = 119.4 * (1 - p); up.classList.toggle("show", scrollY > 600);
  }, { passive: true });
}

function easter() {
  const seq = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"]; let p = 0;
  const toast = document.createElement("div"); toast.id = "toast"; toast.setAttribute("role", "status"); document.body.appendChild(toast);
  addEventListener("keydown", (e) => {
    if ($("lb").classList.contains("open")) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    p = k === seq[p] ? p + 1 : (k === seq[0] ? 1 : 0);
    if (p < seq.length) return;
    p = 0; toast.textContent = "Achievement unlocked: Konami Code"; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2800);
    if (REDUCE) return;
    const cols = ["#FFE97A", "#E3B505", "#ffb347", "#2b2410"];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("i"); c.className = "conf";
      c.style.cssText = "left:" + Math.random() * 100 + "vw;background:" + cols[i % 4] + ";--dx:" + (Math.random() * 160 - 80) + "px;--r:" + (Math.random() * 720 - 360) + "deg;animation-delay:" + Math.random() * .4 + "s;animation-duration:" + (1.6 + Math.random() * 1.4) + "s";
      document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
    }
  });
}



header(); about(); research(); projects(); skills(); education(); certificates();
